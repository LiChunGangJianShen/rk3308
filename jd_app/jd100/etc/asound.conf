defaults.pcm.rate_converter "speexrate_medium"
pcm.!default
{
    type asym
    playback.pcm {
        type plug
        slave.pcm "line"
    }
    capture.pcm {
        type plug
        slave.pcm "mic_ref"
    }
}

pcm.lineout {
    type softvol
    slave.pcm "playback_lineout"
    control {
        name "playback_softvol"
        card es8388aio
    }
    min_dB -50.0
    max_dB 0.0
    resolution 100
}

pcm.playback_lineout {
    type dmix
    ipc_key 5978293 # must be unique for all dmix plugins!!!!
    ipc_key_add_uid yes
    slave {
        pcm "hw:ti3104,0"
        channels 2
        rate 22050
        period_size 220
        buffer_size 440
    }
    bindings {
        0 0
        1 1
    }
}

pcm.playback_mono {
    type route
    slave.pcm "playback"
    slave.channels 2
    ttable {
        0.0 1
        0.1 1
    }
}

pcm.mic {
    type plug
    slave {
        pcm "hw:es7210,0"
    }
}

pcm.line {
    type plug
    slave {
        pcm "hw:ti3104,0"
    }
}

pcm.uac {
    type plug
    slave {
        pcm "hw:UAC1Gadget,0"
    }
}

#uac playback mono
pcm.uac_mono {
    type route
    slave.pcm "uac"
    slave.channels 2
    ttable {
        0.0 0.5
        0.1 0.5
    }
}

pcm.mic_ref {
    type multi
    slaves.a.pcm mic
    slaves.b.pcm line
    slaves.a.channels 8
    slaves.b.channels 2
    bindings.0.slave a
    bindings.0.channel 0
    bindings.1.slave a
    bindings.1.channel 1
    bindings.2.slave a
    bindings.2.channel 2
    bindings.3.slave a
    bindings.3.channel 3
    bindings.4.slave a
    bindings.4.channel 4
    bindings.5.slave a
    bindings.5.channel 5
    bindings.6.slave a
    bindings.6.channel 6
    bindings.7.slave a
    bindings.7.channel 7
    bindings.8.slave b
    bindings.8.channel 0
    bindings.9.slave b
    bindings.9.channel 1
}