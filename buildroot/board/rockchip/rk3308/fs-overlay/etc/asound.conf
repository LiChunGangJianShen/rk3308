defaults.pcm.rate_converter "speexrate_medium"
pcm.!default
{
    type asym
    playback.pcm {
        type plug
        slave.pcm "softvol"
    }
    capture.pcm {
        type plug
        slave.pcm "multi_all"
    }
}
pcm.uac
{
    type asym
    playback.pcm {
        type plug
        slave.pcm "uac_playback"
    }
    capture.pcm {
        type plug
        slave.pcm "uac_capture"
    }
}

pcm.uac_playback {
    type plug
    slave.pcm "hw:3,0"
}
pcm.uac_capture {
    type plug
    slave.pcm "hw:3,0"
}

pcm.softvol {
    type softvol
    slave.pcm "playback"
    control {
        name "playback_softvol"
        card 2
    }
    min_dB -50.0
    max_dB 0.0
    resolution 100
}

pcm.tonevol {
    type plug
    slave.pcm {
        type softvol
        slave.pcm "playback"
        control {
            name "playback_tonevol"
            card 2
        }
        min_dB -50.0
        max_dB -25.0
        resolution 100
    }
}

pcm.playback {
    type dmix
    ipc_key 5978293 # must be unique for all dmix plugins!!!!
    ipc_key_add_uid yes
    slave {
        pcm "hw:2,0"
        channels 2
        rate 48000
        period_size 480
        buffer_size 4800
    }
    bindings {
        0 0
        1 1
    }
}

pcm.real_playback {
    type dshare
    ipc_key 5978293 # must be unique for all dmix plugins!!!!
    ipc_key_add_uid yes
    slave {
        pcm "hw:0,0"
        channels 2
	rate 48000
        period_size 1024
        buffer_size 4096
    }
    bindings {
        0 0
        1 1
    }
}

#aplay -D plug:ladspa /data/test.wav
pcm.ladspa {
    type ladspa
    slave.pcm "plug:real_playback"
    channels 2
    path "/usr/lib"
    playback_plugins [{
        label eq_drc_stereo
            input {
                controls [4]
            }
    }]
}

